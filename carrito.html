<!DOCTYPE html>
<html lang="es">
<head>
    <title>Carrito</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>

    <header>
        <h1>Tienda Gonzalo</h1>

        <nav id="menu">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="carrito.html">Carrito</a>
            <a href="pedidos.html">Pedidos</a>
        </nav>
    </header>

    <main>
        <h2>Mi carrito</h2>

        <div id="lista-carrito"></div>

        <h3 id="total">Total: $0</h3>

        <h2>Finalizar compra</h2>

        <form id="formulario-compra">

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo electronico:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">Telefono:</label>
            <input type="tel" id="telefono" name="telefono" required>

            <label for="fecha">Fecha de entrega:</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="entrega">Tipo de entrega:</label>
            <select id="entrega" name="entrega" required>
                <option value="">Seleccionar</option>
                <option value="Domicilio">Envio a domicilio</option>
                <option value="Local">Retirar en el local</option>
            </select>

            <p>Medio de pago:</p>

            <label>
                <input type="radio" name="pago" value="Efectivo" required>
                Efectivo
            </label>

            <label>
                <input type="radio" name="pago" value="Transferencia">
                Transferencia
            </label>

            <button type="submit">Confirmar compra</button>

        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
